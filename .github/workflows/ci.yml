name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check (src + tests)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # The `bin` entry points at dist/, so a broken build would otherwise
      # only surface after publishing.
      - name: Build
        run: npm run build
      - name: Smoke-test the built CLI
        run: node dist/cli.js examples/good-story.json
